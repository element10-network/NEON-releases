# An electrode's neond, locked down (review 2026-11-15; owner decision the same night). A drop-in
# for neond.service on an electrode's server only (atoms need root for nmcli, the hotspot, Wi-Fi,
# port 80 and SSH users): /etc/systemd/system/neond.service.d/electrode.conf (docs/HUB.md).
# Still root (it replaces its own binary on an update), but with no root powers beyond binding a
# port, the system read-only except its own directories, and no new privileges **(verify** on eu1:
# the Plasma, TURN, the panel behind Caddy, the explorer, an update and its rollback**)**.
# Not a full wall: /usr/local/bin stays writable for its updates, and a program put there runs
# before the system's for root's commands (sudo's path). Its own directory for the binary would
# close that (a later step).
[Service]
NoNewPrivileges=yes
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=
ProtectSystem=strict
ReadWritePaths=/opt/neon -/var/lib/neon /usr/local/bin
# The update guard's mark for a start on a full card (/run is read-only otherwise).
RuntimeDirectory=neon-guard
RuntimeDirectoryPreserve=yes
PrivateDevices=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
SystemCallArchitectures=native
SystemCallFilter=@system-service
